
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            border: none;
            background: #0284c7;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #0369a1;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Cloaked Launcher</h1>
        <p>Open any site smoothly inside an <code>about:blank</code> tab.</p>
        
        <form id="urlForm" class="input-group">
            <input 
                type="text" 
                id="urlInput" 
                placeholder="https://example.com" 
                required 
                autocomplete="off"
            >
            <button type="submit">Launch Page</button>
        </form>
    </div>

    <script>
        document.getElementById('urlForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let url = document.getElementById('urlInput').value.trim();

            // Automatically add https:// if missing
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            // Open a blank new tab
            const win = window.open('about:blank', '_blank');

            if (win) {
                // Construct full screen iframe code with zero margins/padding
                const htmlContent = `
                    <!DOCTYPE html>
                    <html style="margin:0; padding:0; width:100%; height:100%; overflow:hidden;">
                    <head>
                        <title>about:blank</title>
                        <style>
                            html, body {
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                height: 100%;
                                overflow: hidden;
                                background-color: #000;
                            }
                            iframe {
                                border: none;
                                width: 100%;
                                height: 100%;
                                display: block;
                            }
                        </style>
                    </head>
                    <body>
                        <iframe src="${url}"></iframe>
                    </body>
                    </html>
                `;

                // Write content into the new tab
                win.document.open();
                win.document.write(htmlContent);
                win.document.close();
            } else {
                alert('Pop-up blocked! Please allow pop-ups for this page to work.');
            }
        });
    </script>
</body>
</html>
